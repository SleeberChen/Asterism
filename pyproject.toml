[project]
name = "asterism"
version = "0.1.0"
description = "Asterism 企业级 AI 应用开发框架（Python 3.13 + FastAPI，DDD 四层 + 一切皆插件）"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# 一等依赖版本由 `uv` 实测解析并锁定为精确版本（P5 §4.2 V1 / TC-06：禁止 latest/范围/留空）
# 实测环境：uv 0.12.1 + PyPI 可达（2026-10-09 解析）
dependencies = [
    "deepagents==0.7.23",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langchain==1.4.4",
    "langgraph==1.2.14",
    "pydantic==2.14.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.36",
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "greenlet==3.5.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asterism"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
# 排除项逐条登记（P5 §6.2 口径③：未登记排除视为违规）
# 仅排除各层空 __init__.py（无业务逻辑的包声明文件）
omit = [
    "asterism/interfaces/*/__init__.py",
    "asterism/application/*/__init__.py",
    "asterism/domain/*/__init__.py",
    "asterism/infrastructure/*/__init__.py",
    "asterism/plugins/*/__init__.py",
]

[tool.coverage.report]
# 分域输出（P5 §6.2：核心域/非核心域分别给值）
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]
